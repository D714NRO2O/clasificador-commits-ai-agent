name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install ruff

      - name: Verificar estilo del codigo
        run: ruff check app/

  construir:
    runs-on: ubuntu-latest
    needs: calidad

    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen Docker
        run: docker build -t api-ia:ci .

  pruebas:
    runs-on: ubuntu-latest
    needs: calidad

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iadb
          POSTGRES_PASSWORD: claveCI
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iadb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: iadb
      DB_USER: postgres
      DB_PASSWORD: claveCI
      MOTOR_POR_DEFECTO: eco

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest httpx

      - name: Inicializar base de datos
        run: psql -h localhost -U postgres -d iadb -f db/init.sql
        env:
          PGPASSWORD: claveCI

      - name: Ejecutar pruebas
        run: python -m pytest -v
