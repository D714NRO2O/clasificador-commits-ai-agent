name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  calidad:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: pip install ruff

      - name: Verificar estilo del codigo
        run: ruff check app/

  construir:
    runs-on: ubuntu-latest
    needs: calidad

    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen Docker
        run: docker build -t api-ia:ci .
